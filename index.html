<script>
 // Restore Firebase while the browser downloads the interface and styles.
 if(!(/^(localhost|127\.0\.0\.1)$/.test(location.hostname)&&new URLSearchParams(location.search).has('demo'))){
  if(/\/admin\/(?:index\.html)?$/.test(location.pathname)||new URLSearchParams(location.search).has('studio')||location.hash==='#admin'){
   import('./studio-memory.js?v=studio-memory-1').then(m=>m.startStudioMemory()).catch(()=>{});
   // Fetch the dependencies for the first authenticated reads in parallel.
   for(const file of ['firebase-app.js','firebase-auth.js','firebase-firestore-lite.js','firebase-functions.js','firebase-firestore.js']){
    const link=document.createElement('link');
    link.rel='modulepreload';
    link.crossOrigin='anonymous';
    link.href='https://www.gstatic.com/firebasejs/12.5.0/'+file;
    document.head.append(link);
   }
   for(const path of ['firebase-config.js','model.js','studio-startup.js?v=studio-speed-2']){
    const link=document.createElement('link');link.rel='modulepreload';link.href=path;document.head.append(link);
   }
   import('./studio-network.js?v=studio-eu-1').then(module=>module.preloadStudio()).catch(()=>{});
  }
  import('./api-bundle.js?v=d53d0806c243a2f2').catch(()=>{});
 }
</script>
